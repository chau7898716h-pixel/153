<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VJIAPJMTK</title>
  <!-- Global CDN builds (no ESM) -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2/src/md5.min.js"></script>
  <style>
    /* ========== 全局主题变量 (风格19: 赛博朋克 + 微拟物/玻璃质感混搭，根据参考图调整为柔和蓝白微拟物+轻玻璃) ==========
       实际上参考图呈现柔和微拟物+玻璃态，故采用柔和蓝白基调，但保留一定霓虹感(高光/发光) 与卡片微阴影
       风格编号：取生成时间戳计算得出19，但视觉调整为更接近参考图的柔和玻璃态；为了符合参考图，采用以下变量 */
    :root {
      /* 主色调：柔和蓝 + 浅灰白背景，带霓虹感高光 */
      --bg: #f2f6fc;
      --surface: rgba(255, 255, 255, 0.7);
      --surface-solid: #ffffff;
      --primary: #4a90e2;
      --primary-glow: rgba(74, 144, 226, 0.2);
      --secondary: #a0c6f0;
      --text-primary: #1e2a3a;
      --text-secondary: #5a6e85;
      --text-tertiary: #8a9bb0;
      --border-light: rgba(255, 255, 255, 0.5);
      --border-glass: rgba(255, 255, 255, 0.6);
      --shadow-sm: 0 4px 12px rgba(0, 20, 40, 0.04), 0 2px 6px rgba(0, 20, 40, 0.02);
      --shadow-md: 0 12px 28px -8px rgba(0, 30, 60, 0.12), 0 4px 12px rgba(0, 0, 0, 0.02);
      --shadow-glow: 0 8px 24px -4px rgba(74, 144, 226, 0.25);
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-sm: 12px;
      --spacing-xs: 6px;
      --spacing-sm: 10px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --font-primary: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --tab-height: 64px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-primary);
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.4;
      min-height: 100vh;
      /* 背景柔光晕染，呼应参考图 */
      background-image: radial-gradient(circle at 10% 20%, rgba(190, 220, 255, 0.4) 0%, transparent 30%),
                        radial-gradient(circle at 90% 70%, rgba(200, 235, 255, 0.4) 0%, transparent 35%),
                        radial-gradient(circle at 30% 90%, rgba(220, 240, 255, 0.3) 0%, transparent 30%);
      background-attachment: fixed;
    }

    #app {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: transparent;
      padding-bottom: calc(var(--tab-height) + var(--safe-bottom) + 12px);
      display: flex;
      flex-direction: column;
    }

    /* 无 Tab 页面的内边距调整 */
    .no-tab #app {
      padding-bottom: 0;
    }

    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      animation: fadeUp 0.3s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0.5; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 路由过渡 */
    .fade-enter-active,
    .fade-leave-active {
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .fade-enter-from {
      opacity: 0;
      transform: translateY(8px);
    }
    .fade-leave-to {
      opacity: 0;
      transform: translateY(-8px);
    }

    /* 通用容器 */
    .container {
      padding: var(--spacing-md);
      width: 100%;
    }

    /* 顶部安全区 */
    .safe-top {
      padding-top: env(safe-area-inset-top, 0px);
    }

    /* 玻璃卡片 */
    .glass-card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-sm);
      padding: var(--spacing-md);
    }

    /* 底部标签栏 */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      height: calc(var(--tab-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.02);
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-tertiary);
      font-size: 11px;
      font-weight: 500;
      gap: 4px;
      min-width: 60px;
      height: 44px;
      transition: color 0.2s, transform 0.2s;
      border-radius: 12px;
    }

    .tab-item .tab-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab-item .tab-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tab-item.active {
      color: var(--primary);
      transform: translateY(-2px);
    }

    .tab-item.active .tab-icon {
      filter: drop-shadow(0 4px 8px rgba(74, 144, 226, 0.3));
    }

    /* 首页品牌头部 */
    .brand-header {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: var(--spacing-md) var(--spacing-md) 0;
    }

    .brand-name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      background: linear-gradient(135deg, #1e2a3a 0%, #3a5a7a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-slogan {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    /* 图标入口网格 */
    .icon-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-md);
      padding: var(--spacing-md);
    }

    .icon-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-md) var(--spacing-sm);
      border-radius: var(--radius-md);
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: var(--text-primary);
      transition: transform 0.15s, box-shadow 0.2s;
      min-height: 100px;
      position: relative;
      overflow: hidden;
    }

    .icon-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .icon-card:active {
      transform: scale(0.97);
    }

    .icon-card .icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(145deg, #ffffff, #e6f0fc);
      box-shadow: 6px 6px 12px rgba(0, 30, 60, 0.06), -6px -6px 12px rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }

    .icon-card .icon-wrapper svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      text-align: center;
      letter-spacing: -0.01em;
    }

    /* 股票列表 */
    .stock-list {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
      padding: 0 var(--spacing-md) var(--spacing-md);
    }

    .stock-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-md);
      background: var(--surface);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: var(--text-primary);
      transition: background 0.15s, transform 0.1s;
      min-height: 64px;
    }

    .stock-item:active {
      transform: scale(0.99);
      background: rgba(255, 255, 255, 0.9);
    }

    .stock-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .stock-symbol {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .stock-name {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .stock-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .stock-price {
      font-size: 16px;
      font-weight: 700;
    }

    .stock-change {
      font-size: 13px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(74, 144, 226, 0.08);
    }

    .stock-change.up {
      color: #e85d4a;
      background: rgba(232, 93, 74, 0.1);
    }

    .stock-change.down {
      color: #2e8bc0;
      background: rgba(46, 139, 192, 0.1);
    }

    /* 详情页图表 */
    .chart-container {
      padding: var(--spacing-md);
      width: 100%;
    }

    /* 通用页面头部 */
    .page-header {
      display: flex;
      align-items: center;
      padding: var(--spacing-md);
      gap: var(--spacing-md);
      padding-top: calc(env(safe-area-inset-top, 0px) + var(--spacing-md));
    }

    .back-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.1s;
      flex-shrink: 0;
    }

    .back-btn:active {
      transform: scale(0.92);
    }

    .back-btn svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* 工具箱列表 */
    .tool-list {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
      padding: var(--spacing-md);
    }

    .tool-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      padding: var(--spacing-md);
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: var(--text-primary);
      min-height: 64px;
      transition: transform 0.1s;
    }

    .tool-item:active {
      transform: scale(0.99);
    }

    .tool-icon {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: linear-gradient(145deg, #e6f0fc, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      box-shadow: 2px 2px 8px rgba(0,0,0,0.02);
      flex-shrink: 0;
    }

    .tool-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tool-label {
      font-size: 16px;
      font-weight: 600;
      flex: 1;
    }

    /* 设定列表 */
    .settings-group {
      padding: var(--spacing-md);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }

    .settings-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-md);
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: var(--text-primary);
      min-height: 56px;
    }

    .settings-item .label {
      font-size: 15px;
      font-weight: 500;
    }

    .settings-item .value {
      font-size: 14px;
      color: var(--text-tertiary);
    }

    /* 加载页 */
    .loading-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: var(--spacing-lg);
      background: var(--bg);
    }

    .loading-logo {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(145deg, #ffffff, #e6f0fc);
      box-shadow: var(--shadow-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    .loading-logo svg {
      width: 48px;
      height: 48px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 1.5;
    }

    .loading-text {
      font-size: 15px;
      color: var(--text-secondary);
      font-weight: 500;
      letter-spacing: 0.4px;
    }

    /* 表单元素 */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: var(--spacing-md);
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.2px;
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(0, 0, 0, 0.06);
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      font-size: 16px;
      font-family: inherit;
      color: var(--text-primary);
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      min-height: 44px;
    }

    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
    }

    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      min-height: 44px;
      width: 100%;
      font-family: inherit;
      box-shadow: var(--shadow-glow);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.35;
      pointer-events: none;
      box-shadow: none;
    }

    /* 日历 */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 13px;
    }

    .calendar-header {
      font-weight: 600;
      color: var(--text-tertiary);
      padding: 6px 0;
    }

    .calendar-day {
      padding: 8px 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.4);
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
    }

    .calendar-day.checked {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: calc(var(--tab-height) + var(--safe-bottom) + 20px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 12px 24px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(12px);
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
      animation: toastIn 0.3s ease;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* 卡片内边距等工具类 */
    .mt-sm { margin-top: var(--spacing-sm); }
    .mb-md { margin-bottom: var(--spacing-md); }
    .text-center { text-align: center; }
    .flex-col { display: flex; flex-direction: column; gap: var(--spacing-sm); }
    .text-secondary { color: var(--text-secondary); }

    /* 工具/设置等子页面通用 */
    .sub-page {
      padding: var(--spacing-md);
      padding-top: 0;
      width: 100%;
    }

    /* 隐私/服务声明文本 */
    .policy-text {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-secondary);
      white-space: pre-wrap;
      padding: var(--spacing-md);
      background: var(--surface);
      backdrop-filter: blur(8px);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-glass);
    }

    /* 反馈页表单 */
    .feedback-form {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      padding: var(--spacing-md);
    }

    /* 信件弹窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: var(--spacing-md);
    }

    .modal-card {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      max-width: 90%;
      width: 360px;
      box-shadow: var(--shadow-md);
    }

    .modal-card h3 {
      font-size: 18px;
      margin-bottom: var(--spacing-sm);
    }

    .modal-card p {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: var(--spacing-md);
      white-space: pre-wrap;
    }

    /* 密码强度条 */
    .strength-bar {
      height: 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.06);
      overflow: hidden;
      margin: 8px 0;
    }

    .strength-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.2s, background 0.2s;
    }

    /* 细节调整 */
    .text-mono {
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 13px;
      letter-spacing: 0.2px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="app">
    <router-view v-slot="{ Component }">
      <transition name="fade" mode="out-in">
        <component :is="Component" />
      </transition>
    </router-view>
  </div>

  <script>
    // ============================================================
    // 如何新增一个页面：
    // 1. 在 routes 数组中添加新的路由对象 { path: '/new-page', component: NewPageComponent }
    // 2. 定义组件 NewPageComponent（使用 template 或 render）
    // 3. 如需底部 Tab，在 App 组件中调整 tabLinks 数组，但注意：新页面可能需添加 tab 项
    // 4. 确保组件内使用 <page-header> 风格保持一致
    // 注意：所有界面文案必须英文！
    // ============================================================

    const { createApp, ref, computed, onMounted, watch, nextTick } = Vue;
    const { createRouter, createWebHashHistory, useRouter, useRoute } = VueRouter;

    // ========== 静态数据 ==========
    // 股票列表 (>=20条)
    const STOCKS = [
      { symbol: 'AAPL', name: 'Apple Inc.', price: 175.34, change: 1.24, changePercent: 0.71 },
      { symbol: 'MSFT', name: 'Microsoft Corp.', price: 328.79, change: -2.15, changePercent: -0.65 },
      { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 138.21, change: 0.98, changePercent: 0.71 },
      { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 128.56, change: 2.43, changePercent: 1.93 },
      { symbol: 'TSLA', name: 'Tesla Inc.', price: 238.45, change: -5.67, changePercent: -2.32 },

              </svg>
            </div>
          </div>
        </div>
      `,
      setup() {
        const route = useRoute();
        const symbol = route.params.symbol;
        const stock = STOCKS.find(s => s.symbol === symbol) || STOCKS[0];

        // 生成最近一个月价格数据 (30天)
        const points = [];
        const basePrice = stock.price * 0.85;
        const volatility = stock.price * 0.08;
        for (let i = 0; i < 30; i++) {
          const trend = (i / 30) * stock.price * 0.2;
          const noise = (Math.sin(i * 0.8) * 0.5 + Math.cos(i * 0.3) * 0.3) * volatility;
          points.push(Math.max(0.1, basePrice + trend + noise));
        }
        const min = Math.min(...points) * 0.95;
        const max = Math.max(...points) * 1.05;
        const range = max - min || 1;

        // 映射到 SVG 坐标 (x: 10~330, y: 160~20)
        const xStep = 320 / (points.length - 1);
        const chartPoints = points.map((p, i) => {
          const x = 10 + i * xStep;
          const y = 160 - ((p - min) / range) * 140;
          return { x, y };
        });

        const chartPath = computed(() => {
          return chartPoints.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(2) + ' ' + p.y.toFixed(2)).join(' ');
        });

        const areaPath = computed(() => {
          const line = chartPoints.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(2) + ' ' + p.y.toFixed(2)).join(' ');
          return line + ' L ' + chartPoints[chartPoints.length-1].x.toFixed(2) + ' 160 L ' + chartPoints[0].x.toFixed(2) + ' 160 Z';
        });

        // Y轴标签 (3个)
        const yLabels = computed(() => {
          const labels = [];
          for (let i = 0; i <= 2; i++) {
            const val = min + (range / 2) * i;
            const y = 160 - ((val - min) / range) * 140;
            labels.push({ y, text: val.toFixed(2) });
          }
          return labels;
        });

        return { stock, chartPath, areaPath, yLabels };
      }
    };

      }

          if (/[^A-Za-z0-9]/.test(p)) score++;

        const strengthColor = computed(() => {
          const colors = ['#e85d4a', '#f0a030', '#f0d030', '#8bc34a', '#4caf50'];
